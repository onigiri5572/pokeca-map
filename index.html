<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ポケカ取扱いコンビニ帳</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d2433">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ポケカ帳">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#f4f3ef; --card:#fff; --ink:#1d2433; --sub:#667085; --line:#e4e2db;
  --accent:#e63946; --yes:#16a34a; --no:#9ca3af; --unk:#f59e0b;
  --stock:#16a34a; --soldout:#e63946; --none:#6b7280;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{font-size:16px} /* iPhoneの自動ズーム防止 */
.wrap{max-width:720px;margin:0 auto;width:100%;min-width:0}
header{position:sticky;top:0;z-index:10;background:#1d2433;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
header .top{display:flex;align-items:center;gap:8px}
header h1{font-size:17px;margin:0;font-weight:800}
header h1 span{color:#ffcf3f}
.hbtn{border:0;border-radius:10px;padding:8px 11px;background:#2f3a52;color:#fff;font-weight:700;font-size:14px}
.ml{margin-left:auto}
.filters{background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:9;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.chip.ch{opacity:.45}
.chip.ch.on{opacity:1;background:#fff;color:var(--ink);border-color:var(--ink)}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.txt{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}
.count{font-size:12px;color:var(--sub);padding:8px 14px 4px;display:flex;justify-content:space-between;gap:8px}
.list{background:var(--card)}
.item{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:active{background:#f6f5f1}
.badge{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px}
.item .nm{font-weight:700;font-size:15px;line-height:1.3}
.item .meta{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.4}
.item .right{margin-left:auto;text-align:right;flex:none;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:3px 7px;color:#fff;white-space:nowrap}
.tag.yes{background:var(--yes)} .tag.no{background:var(--no)} .tag.unknown{background:#fff;color:var(--unk);border:1px solid var(--unk)}
.tag.hot{background:var(--accent)}
.res{font-weight:800}
.res.stock{color:var(--stock)} .res.soldout{color:var(--soldout)} .res.none{color:var(--none)}
.empty{padding:28px 18px;color:var(--sub);font-size:14px;line-height:1.8;text-align:center}
.more{display:block;width:100%;border:0;background:#fff;padding:14px;color:#2563eb;font-weight:700;border-bottom:1px solid var(--line)}
.foot{padding:16px 14px calc(24px + env(safe-area-inset-bottom));font-size:12px;color:var(--sub);line-height:1.7}
.foot button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;color:var(--ink)}

/* detail */
#detail{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;transform:translateX(100%);transition:transform .22s ease;-webkit-overflow-scrolling:touch}
#detail.open{transform:none}
.dhead{position:sticky;top:0;z-index:2;background:#1d2433;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:8px}
.dhead .back{border:0;background:none;color:#fff;font-weight:700;font-size:15px;padding:4px 0}
.dinfo{background:var(--card);padding:14px;border-bottom:1px solid var(--line)}
.dname{font-size:19px;font-weight:800;display:flex;gap:10px;align-items:center;line-height:1.3}
.dsub{font-size:13px;color:var(--sub);margin-top:6px;line-height:1.6}
.dlinks{margin-top:8px;display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.dlinks a{color:#2563eb;font-weight:700;text-decoration:none}
.dlinks button{border:0;background:none;padding:0;color:var(--sub);font-size:14px;text-decoration:underline}
.sec{background:var(--card);padding:14px;margin-top:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sec h3{font-size:13px;margin:0 0 10px;color:var(--sub);font-weight:800}
.seg{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:11px 4px;font-weight:800;font-size:15px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on.yes,.seg button.on.stock{background:var(--yes);color:#fff}
.seg button.on.no{background:var(--no);color:#fff}
.seg button.on.unknown{background:var(--unk);color:#fff}
.seg button.on.soldout{background:var(--soldout);color:#fff}
.seg button.on.none{background:var(--none);color:#fff}
.slotpick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slotpick button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 2px;font-weight:800;font-size:14px;line-height:1.2}
.slotpick button small{display:block;font-weight:500;font-size:10px;color:var(--sub)}
.slotpick button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.slotpick button.on small{color:#cbd5e1}
textarea.txt{resize:vertical;min-height:64px}
.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:800;background:var(--ink);color:#fff;width:100%;font-size:15px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--accent);border:1px solid #f3c1c5}
.lbl{font-size:12px;color:var(--sub);font-weight:700;margin:12px 0 6px}
.slots{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:end}
.slot{text-align:center;font-size:11px;color:var(--sub)}
.slot .bar{height:54px;border-radius:6px;background:#f1f0ec;position:relative;overflow:hidden;margin-bottom:3px}
.slot .bar i{position:absolute;left:0;right:0;bottom:0;background:var(--stock);border-radius:6px}
.slot .bar i.so{background:var(--soldout);opacity:.3}
.slot b{display:block;color:var(--ink);font-size:13px}
.slot.best b{color:var(--stock)}
.hint{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.6}
.log{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.log:last-child{border-bottom:0}
.log .when{color:var(--sub);flex:none;width:112px;font-size:13px;line-height:1.5}
.log .memo{margin-top:3px;white-space:pre-wrap;word-break:break-word}
.log .del{margin-left:auto;border:0;background:none;color:var(--sub);font-size:18px;padding:0 4px;flex:none}

/* overlays */
#modal{position:fixed;inset:0;background:rgba(15,20,30,.5);display:grid;place-items:center;z-index:50;padding:16px}
#modal[hidden]{display:none}
.mbox{background:#fff;border-radius:16px;max-width:480px;width:100%;max-height:88vh;overflow:auto;padding:18px}
.mbox h2{margin:0 0 10px;font-size:18px}
.mbox p{font-size:14px;line-height:1.7;color:#344054;margin:6px 0}
.mbox label{display:block;font-size:13px;font-weight:700;margin:12px 0 4px}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btns .btn{flex:1;min-width:130px}
.mbox hr{border:0;border-top:1px solid var(--line);margin:16px 0}
#loading{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;padding:24px;text-align:center}
#loading[hidden]{display:none}
#loading .box{max-width:360px}
#loading h2{font-size:18px;margin:0 0 8px}
#loading p{font-size:14px;color:var(--sub);line-height:1.7}
.spin{width:36px;height:36px;border:4px solid #ddd;border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1d2433;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <h1>ポケカ<span>取扱いコンビニ帳</span></h1>
    <button class="hbtn ml" id="btnAdd" title="店舗を追加">＋</button>
    <button class="hbtn" id="btnSettings" title="設定">⚙</button>
  </div>
</header>
<div class="filters">
  <div class="wrap" style="display:flex;flex-direction:column;gap:8px">
    <div class="row">
      <select class="txt" id="fArea">
        <option value="all">すべての地域</option>
        <option value="相模原市">相模原市（全区）</option>
        <option value="相模原市緑区">　相模原市 緑区</option>
        <option value="相模原市中央区">　相模原市 中央区</option>
        <option value="相模原市南区">　相模原市 南区</option>
        <option value="町田市">町田市</option>
      </select>
      <select class="txt" id="fSort">
        <option value="name">名前順</option>
        <option value="recent">最近確認した順</option>
        <option value="near">近い順（現在地）</option>
      </select>
    </div>
    <div class="chips" id="fChain"></div>
    <div class="chips" id="fStatus">
      <button class="chip on" data-f="all">すべて</button>
      <button class="chip" data-f="yes">扱いあり</button>
      <button class="chip" data-f="hot">3日以内に在庫あり</button>
      <button class="chip" data-f="unknown">未確認</button>
      <button class="chip" data-f="no">扱いなし</button>
      <button class="chip" data-f="closed">非表示にした店</button>
    </div>
    <input class="txt" id="fQ" type="search" placeholder="店名・住所・メモで検索">
  </div>
</div>
<div class="wrap">
  <div class="count" id="count"></div>
  <div class="list" id="list"></div>
  <div class="foot" id="foot"></div>
</div>

<div id="detail"></div>
<div id="loading" hidden><div class="box" id="loadingBox"></div></div>
<div id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(() => {
'use strict';
// ===== 定数 =====
const DATA_KEY  = 'pokeca-list:data:v1';   // 記録（扱い・履歴・メモ・手動追加店舗）
const CACHE_KEY = 'pokeca-list:stores:v1'; // OpenStreetMapから取った店舗リスト
const UI_KEY    = 'pokeca-list:ui:v1';
const OVERPASS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.private.coffee/api/interpreter',
  'https://maps.mail.ru/osm/tools/overpass/api/interpreter',
];
const QUERY = `[out:json][timeout:180];
area["name"="相模原市"]["boundary"="administrative"]->.s;
area["name"="町田市"]["boundary"="administrative"]->.m;
.s out tags;
nwr["shop"="convenience"](area.s);
out center tags;
.m out tags;
nwr["shop"="convenience"](area.m);
out center tags;
rel(area.s)["boundary"="administrative"]["name"~"^(緑区|中央区|南区)$"];
map_to_area->.wards;
foreach.wards->.w(
  .w out tags;
  nwr["shop"="convenience"](area.w);
  out ids;
);`;
const CHAINS = {
  seven:    {l:'セブン-イレブン',  s:'セブン',     b:'7', c:'#f26f21', re:/セブン|7-?eleven|seven[\s-]?eleven/i},
  lawson:   {l:'ローソン',        s:'ローソン',   b:'L', c:'#1a6fc4', re:/ローソン|lawson/i},
  family:   {l:'ファミリーマート', s:'ファミマ',   b:'F', c:'#0a9b4a', re:/ファミリーマート|ファミマ|family\s?mart/i},
  ministop: {l:'ミニストップ',    s:'ミニストップ', b:'M', c:'#d99a00', re:/ミニストップ|mini\s?stop/i},
};
const SLOTS = [
  {k:'early',l:'早朝',r:'5–8時',f:5,t:8}, {k:'morning',l:'朝',r:'8–11時',f:8,t:11},
  {k:'noon',l:'昼',r:'11–14時',f:11,t:14}, {k:'afternoon',l:'午後',r:'14–17時',f:14,t:17},
  {k:'evening',l:'夕方',r:'17–20時',f:17,t:20}, {k:'night',l:'夜',r:'20–24時',f:20,t:24},
  {k:'late',l:'深夜',r:'0–5時',f:0,t:5},
];
const SLOT = Object.fromEntries(SLOTS.map(s => [s.k, s]));
const slotOfHour = h => (SLOTS.find(s => h >= s.f && h < s.t) || SLOTS[6]).k;
const RESULTS = {stock:'在庫あり', soldout:'売り切れ', none:'置いてない'};
const HANDLING = {yes:'扱いあり', no:'扱いなし', unknown:'未確認'};
const WD = '日月火水木金土';
const PAGE = 80;

// ===== 小道具 =====
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { toast('保存できませんでした（容量不足の可能性）'); return false; } };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const localISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmtWhen = iso => { const d = new Date(iso); return isNaN(d) ? iso : `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]}) ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtDate = ms => { const d = new Date(ms); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; };
function ago(iso){ const h = (Date.now() - new Date(iso)) / 36e5; if (h < 1) return 'さっき'; if (h < 24) return `${Math.floor(h)}時間前`; const d = Math.floor(h/24); return d < 31 ? `${d}日前` : `${Math.floor(d/30)}か月前`; }
function dist(a, b){ const R = 6371e3, t = Math.PI/180, x = Math.sin((b.lat-a.lat)*t/2)**2 + Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin((b.lng-a.lng)*t/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
const fmtDist = m => m < 1000 ? `${Math.round(m)}m` : `${(m/1000).toFixed(1)}km`;
const kana = s => String(s || '').normalize('NFKC').toLowerCase();
let toastT;
function toast(m, ms = 2600){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms); }

// ===== データ =====
let db = load(DATA_KEY, {version:1, recs:{}, manual:{}});
db.recs ||= {}; db.manual ||= {};
let cache = load(CACHE_KEY, null);
let ui = load(UI_KEY, {area:'all', sort:'name', chains:Object.keys(CHAINS), status:'all'});
let here = null, shown = PAGE, currentId = null;

const rec = id => db.recs[id] || {handling:'unknown', memo:'', logs:[]};
function baseStores(){ return [...(cache?.stores || []), ...Object.values(db.manual)]; }
function view(b){
  const r = rec(b.id);
  return {...b, name:r.customName || b.name, handling:r.handling || 'unknown', memo:r.memo || '', logs:r.logs || [], closed:!!r.closed};
}
const byId = id => { const b = baseStores().find(s => s.id === id); return b && view(b); };
const sortedLogs = s => [...s.logs].sort((a, b) => b.at.localeCompare(a.at));
const lastStock = s => sortedLogs(s).find(l => l.result === 'stock');
const isHot = s => { const l = lastStock(s); return !!l && Date.now() - new Date(l.at) < 3*864e5; };
function updateRec(id, fn){
  const r = db.recs[id] ? db.recs[id] : {handling:'unknown', memo:'', logs:[]};
  fn(r); r.updatedAt = Date.now();
  const empty = r.handling === 'unknown' && !r.memo && !(r.logs && r.logs.length) && !r.customName && !r.closed;
  if (empty) delete db.recs[id]; else db.recs[id] = r;
  save(DATA_KEY, db);
}

// ===== 店舗リスト取得（OpenStreetMap） =====
function chainOf(t){
  const hay = [t.brand, t['brand:ja'], t['brand:en'], t.name, t['name:ja'], t['name:en']].filter(Boolean).join(' ');
  for (const [k, c] of Object.entries(CHAINS)) if (c.re.test(hay)) return k;
  return null;
}
function storeName(t, ch){
  let nm = (t['name:ja'] || t.name || CHAINS[ch].l).trim();
  const br = (t['branch:ja'] || t.branch || '').trim();
  if (br && !nm.includes(br)) nm += ' ' + (/(店|前)$/.test(br) ? br : br + '店');
  return nm;
}
function addrOf(t){
  if (t['addr:full']) return t['addr:full'];
  return [t['addr:province'], t['addr:city'], t['addr:suburb'], t['addr:quarter'], t['addr:neighbourhood'], t['addr:block_number'], t['addr:housenumber']]
    .filter(Boolean).join('').replace(/^神奈川県|^東京都/, '');
}
function parseOverpass(json){
  const stores = new Map(), wardOf = {};
  let mode = null, cur = null;
  for (const e of json.elements || []){
    if (e.type === 'area'){
      const n = e.tags?.name || '';
      if (n === '相模原市' || n === '町田市'){ mode = 'city'; cur = n; }
      else { mode = 'ward'; cur = n; }
      continue;
    }
    const id = `osm:${e.type}/${e.id}`;
    if (mode === 'ward'){ if (cur) wardOf[id] = cur; continue; }
    if (mode !== 'city') continue;
    const t = e.tags || {}, ch = chainOf(t);
    if (!ch) continue;
    const lat = e.lat ?? e.center?.lat, lng = e.lon ?? e.center?.lon;
    if (lat == null) continue;
    stores.set(id, {id, chain:ch, name:storeName(t, ch), city:cur, ward:'', lat, lng, addr:addrOf(t)});
  }
  for (const s of stores.values()){
    if (s.city === '相模原市'){
      let w = wardOf[s.id];
      if (!w){ const m = (s.addr || '').match(/(緑区|中央区|南区)/); if (m) w = m[1]; }
      s.ward = w || '';
    }
  }
  return [...stores.values()];
}
async function fetchStores(){
  let lastErr;
  for (const ep of OVERPASS){
    try {
      const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 200000);
      const r = await fetch(ep, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'data=' + encodeURIComponent(QUERY), signal:ctl.signal});
      clearTimeout(to);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      const list = parseOverpass(j);
      if (!list.length) throw new Error('店舗が0件でした');
      return list;
    } catch (e) { lastErr = e; console.warn(ep, e); }
  }
  throw lastErr || new Error('取得できませんでした');
}
async function refreshStores(first){
  showLoading(`<div class="spin"></div><h2>店舗リストを作成中…</h2><p>相模原市・町田市のセブン-イレブン、ローソン、ファミリーマート、ミニストップを集めています。<br>30秒〜1分ほどかかることがあります。</p>`);
  try {
    const list = await fetchStores();
    const before = new Set((cache?.stores || []).map(s => s.id));
    const added = list.filter(s => !before.has(s.id)).length;
    cache = {fetchedAt:Date.now(), stores:list};
    save(CACHE_KEY, cache);
    hideLoading(); render();
    toast(first ? `${list.length}店舗の一覧ができました` : `更新しました（${list.length}店舗${added ? `・新しく${added}店舗` : ''}）`, 4000);
  } catch (e) {
    showLoading(`<h2>店舗リストを取得できませんでした</h2><p>電波の良い場所で、もう一度試してください。<br><small>（${esc(e.message || e)}）</small></p>
      <div class="btns"><button class="btn" id="retry">もう一度試す</button>${cache ? '<button class="btn ghost" id="cancelLoad">閉じる</button>' : ''}</div>`);
    $('#retry').onclick = () => refreshStores(first);
    if (cache) $('#cancelLoad').onclick = hideLoading;
  }
}
function showLoading(html){ $('#loadingBox').innerHTML = html; $('#loading').hidden = false; }
function hideLoading(){ $('#loading').hidden = true; }

// ===== 一覧 =====
function renderChainChips(){
  $('#fChain').innerHTML = Object.entries(CHAINS).map(([k, c]) =>
    `<button class="chip ch${ui.chains.includes(k) ? ' on' : ''}" data-k="${k}"><span class="sw" style="background:${c.c}"></span>${c.s}</button>`).join('');
}
function areaLabel(s){ return s.city === '相模原市' ? `相模原市${s.ward ? ' ' + s.ward : ''}` : s.city; }
function filtered(){
  const q = kana($('#fQ').value.trim());
  let arr = baseStores().map(view).filter(s => {
    if (!ui.chains.includes(s.chain)) return false;
    if (ui.area !== 'all'){
      if (ui.area === '相模原市' || ui.area === '町田市'){ if (s.city !== ui.area) return false; }
      else if (s.city + s.ward !== ui.area) return false;
    }
    if (ui.status === 'closed') return s.closed;
    if (s.closed) return false;
    if (ui.status === 'yes' && s.handling !== 'yes') return false;
    if (ui.status === 'no' && s.handling !== 'no') return false;
    if (ui.status === 'unknown' && s.handling !== 'unknown') return false;
    if (ui.status === 'hot' && !isHot(s)) return false;
    if (q && !kana([s.name, s.addr, areaLabel(s), s.memo, ...s.logs.map(l => l.memo)].join(' ')).includes(q)) return false;
    return true;
  });
  if (ui.sort === 'near' && here) arr.forEach(s => s.d = dist(here, s));
  arr.sort((a, b) => {
    if (ui.sort === 'near' && here) return a.d - b.d;
    if (ui.sort === 'recent'){ const la = sortedLogs(a)[0]?.at || '', lb = sortedLogs(b)[0]?.at || ''; if (la !== lb) return lb.localeCompare(la); }
    return a.name.localeCompare(b.name, 'ja') || areaLabel(a).localeCompare(areaLabel(b), 'ja');
  });
  return arr;
}
function render(){
  const arr = filtered(), all = baseStores().length;
  const yes = baseStores().filter(b => rec(b.id).handling === 'yes' && !rec(b.id).closed).length;
  $('#count').innerHTML = `<span>${arr.length}店舗を表示</span><span>全${all}店舗中 扱いあり ${yes}店</span>`;
  if (!arr.length){
    $('#list').innerHTML = `<div class="empty">${all ? '条件に合う店舗がありません。' : '店舗リストがまだありません。'}</div>`;
  } else {
    $('#list').innerHTML = arr.slice(0, shown).map(s => {
      const c = CHAINS[s.chain], last = sortedLogs(s)[0];
      const sub = last
        ? `${fmtWhen(last.at)}（${SLOT[last.slot]?.l || ''}） <span class="res ${last.result}">${RESULTS[last.result]}</span>`
        : esc(s.memo ? s.memo.slice(0, 40) : (s.addr || ''));
      return `<div class="item" data-id="${esc(s.id)}">
        <div class="badge" style="background:${c.c}">${c.b}</div>
        <div style="min-width:0"><div class="nm">${esc(s.name)}</div>
          <div class="meta">${esc(areaLabel(s))}${s.d != null ? ' ・ ' + fmtDist(s.d) : ''}</div>
          ${sub ? `<div class="meta">${sub}</div>` : ''}</div>
        <div class="right"><span class="tag ${s.handling}">${HANDLING[s.handling]}</span>${isHot(s) ? '<span class="tag hot">在庫あり</span>' : ''}</div>
      </div>`;
    }).join('') + (arr.length > shown ? `<button class="more" id="more">さらに表示（残り${arr.length - shown}店舗）</button>` : '');
    const m = $('#more'); if (m) m.onclick = () => { shown += PAGE; render(); };
  }
  $('#foot').innerHTML = cache
    ? `店舗データ：OpenStreetMap（${fmtDate(cache.fetchedAt)} 取得）。一覧にない店舗は右上の＋で追加、閉店した店舗は詳細画面から非表示にできます。`
    : '';
}
$('#list').onclick = e => { const it = e.target.closest('.item'); if (it) openDetail(it.dataset.id); };
$('#fArea').onchange = e => { ui.area = e.target.value; shown = PAGE; save(UI_KEY, ui); render(); };
$('#fSort').onchange = e => {
  ui.sort = e.target.value; save(UI_KEY, ui);
  if (ui.sort === 'near') locate(); else render();
};
$('#fChain').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; const k = b.dataset.k;
  ui.chains = ui.chains.includes(k) ? ui.chains.filter(x => x !== k) : [...ui.chains, k];
  if (!ui.chains.length) ui.chains = [k];
  save(UI_KEY, ui); renderChainChips(); shown = PAGE; render(); };
$('#fStatus').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; ui.status = b.dataset.f;
  [...$('#fStatus').children].forEach(c => c.classList.toggle('on', c === b)); save(UI_KEY, ui); shown = PAGE; render(); };
let qT; $('#fQ').oninput = () => { clearTimeout(qT); qT = setTimeout(() => { shown = PAGE; render(); }, 150); };
function locate(){
  if (!navigator.geolocation){ toast('現在地を取得できません'); return render(); }
  toast('現在地を取得中…');
  navigator.geolocation.getCurrentPosition(p => { here = {lat:p.coords.latitude, lng:p.coords.longitude}; render(); toast('近い順に並べました'); },
    () => { toast('現在地を取得できませんでした（位置情報の許可を確認してください）', 4000); render(); },
    {enableHighAccuracy:true, timeout:12000, maximumAge:60000});
}

// ===== 詳細 =====
let draft = {result:'stock', slot:null};
function openDetail(id){
  currentId = id; draft = {result:'stock', slot:slotOfHour(new Date().getHours())};
  renderDetail(); $('#detail').classList.add('open'); $('#detail').scrollTop = 0;
  history.pushState({d:1}, '');
}
function closeDetail(fromPop){
  $('#detail').classList.remove('open'); currentId = null; render();
  if (!fromPop && history.state?.d) history.back();
}
window.addEventListener('popstate', () => { if (currentId) closeDetail(true); });
function renderDetail(){
  const s = byId(currentId); if (!s) return closeDetail();
  const c = CHAINS[s.chain], logs = sortedLogs(s);
  const gUrl = `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}`;
  const cnt = Object.fromEntries(SLOTS.map(x => [x.k, {stock:0, soldout:0}]));
  for (const l of logs) if (cnt[l.slot] && l.result !== 'none') cnt[l.slot][l.result]++;
  const max = Math.max(1, ...SLOTS.map(x => cnt[x.k].stock + cnt[x.k].soldout));
  const best = Math.max(...SLOTS.map(x => cnt[x.k].stock));
  const now = new Date();
  $('#detail').innerHTML = `
    <div class="dhead"><button class="back" id="dBack">‹ 一覧へ</button></div>
    <div class="dinfo">
      <div class="dname"><span class="badge" style="background:${c.c}">${c.b}</span><span>${esc(s.name)}</span></div>
      <div class="dsub">${esc(areaLabel(s))}${s.addr ? '　' + esc(s.addr) : ''}${here ? `　現在地から${fmtDist(dist(here, s))}` : ''}${s.closed ? '<br><b style="color:var(--accent)">非表示中の店舗です</b>' : ''}</div>
      <div class="dlinks"><a href="${gUrl}" target="_blank" rel="noopener">Googleマップで場所を見る ↗</a><button id="dRename">店名を編集</button></div>
    </div>

    <div class="sec"><h3>ポケモンカードの扱い</h3>
      <div class="seg" id="segH">${['yes','no','unknown'].map(k => `<button data-k="${k}" class="${k}${s.handling === k ? ' on' : ''}">${HANDLING[k]}</button>`).join('')}</div>
    </div>

    <div class="sec"><h3>販売を確認した記録を追加</h3>
      <div class="seg" id="segR">${Object.entries(RESULTS).map(([k, v]) => `<button data-k="${k}" class="${k}${draft.result === k ? ' on' : ''}">${v}</button>`).join('')}</div>
      <div class="lbl">時間帯</div>
      <div class="slotpick" id="slotPick">${SLOTS.map(x => `<button data-k="${x.k}" class="${draft.slot === x.k ? 'on' : ''}">${x.l}<small>${x.r}</small></button>`).join('')}</div>
      <div class="lbl">日時</div>
      <input type="datetime-local" class="txt" id="fAt" value="${localISO(now)}">
      <div class="lbl">メモ</div>
      <textarea class="txt" id="fMemo" placeholder="例：レジ横に3パック、1人1パックまで、10時ごろ品出し"></textarea>
      <div style="height:10px"></div>
      <button class="btn" id="fAdd">記録する</button>
    </div>

    <div class="sec"><h3>時間帯別の記録</h3>
      <div class="slots">${SLOTS.map(x => { const v = cnt[x.k], tot = v.stock + v.soldout;
        return `<div class="slot${best > 0 && v.stock === best ? ' best' : ''}">
          <div class="bar"><i class="so" style="height:${tot/max*100}%"></i><i style="height:${v.stock/max*100}%"></i></div>
          <b>${v.stock}</b>${x.l}</div>`; }).join('')}</div>
      <div class="hint">数字と緑＝在庫ありを見た回数、薄い赤＝売り切れだった回数。${best > 0 ? `<b>${SLOTS.filter(x => cnt[x.k].stock === best).map(x => x.l).join('・')}</b>に在庫を見たことが一番多いです。` : '記録が増えると狙い目の時間帯がわかります。'}</div>
    </div>

    <div class="sec"><h3>店舗メモ</h3>
      <textarea class="txt" id="sMemo" placeholder="例：入荷は火・金曜。店員さんに聞けば教えてくれる">${esc(s.memo)}</textarea>
      <div class="hint" id="sMemoHint">入力すると自動で保存されます</div>
    </div>

    <div class="sec"><h3>確認履歴（${logs.length}件）</h3>
      ${logs.length ? logs.map(l => `<div class="log">
        <div class="when">${fmtWhen(l.at)}<br>${SLOT[l.slot]?.l || ''}</div>
        <div style="min-width:0"><span class="res ${l.result}">${RESULTS[l.result]}</span>${l.memo ? `<div class="memo">${esc(l.memo)}</div>` : ''}</div>
        <button class="del" data-log="${esc(l.id)}" aria-label="削除">×</button></div>`).join('') : '<div class="hint" style="margin:0">まだ記録がありません</div>'}
    </div>

    <div class="sec" style="margin-bottom:calc(30px + env(safe-area-inset-bottom))">
      <button class="btn ghost" id="dHide">${s.closed ? 'この店舗を一覧に戻す' : '閉店・重複などで一覧から非表示にする'}</button>
      ${String(s.id).startsWith('m:') ? '<div style="height:8px"></div><button class="btn danger" id="dDelete">手動追加したこの店舗を削除</button>' : ''}
    </div>`;

  $('#dBack').onclick = () => closeDetail();
  $('#segH').onclick = e => { const k = e.target.closest('button')?.dataset.k; if (!k) return; updateRec(s.id, r => r.handling = k); renderDetail(); };
  $('#segR').onclick = e => { const k = e.target.closest('button')?.dataset.k; if (!k) return; draft.result = k;
    [...$('#segR').children].forEach(b => b.classList.toggle('on', b.dataset.k === k)); };
  $('#slotPick').onclick = e => { const k = e.target.closest('button')?.dataset.k; if (!k) return; draft.slot = k;
    [...$('#slotPick').children].forEach(b => b.classList.toggle('on', b.dataset.k === k)); };
  $('#fAt').onchange = e => { const d = new Date(e.target.value); if (!isNaN(d)){ draft.slot = slotOfHour(d.getHours());
    [...$('#slotPick').children].forEach(b => b.classList.toggle('on', b.dataset.k === draft.slot)); } };
  $('#fAdd').onclick = () => {
    const at = $('#fAt').value || localISO(new Date()), memo = $('#fMemo').value.trim();
    updateRec(s.id, r => {
      r.logs = r.logs || []; r.logs.push({id:uid(), at, slot:draft.slot, result:draft.result, memo});
      if ((r.handling || 'unknown') === 'unknown' && draft.result !== 'none') r.handling = 'yes';
    });
    renderDetail(); toast('記録しました');
  };
  let mT;
  $('#sMemo').oninput = e => { clearTimeout(mT); mT = setTimeout(() => { updateRec(s.id, r => r.memo = e.target.value); $('#sMemoHint').textContent = '保存しました'; }, 400); };
  $('#detail').querySelectorAll('.del').forEach(b => b.onclick = () => confirmBox('この記録を削除しますか？', () => {
    updateRec(s.id, r => r.logs = r.logs.filter(l => l.id !== b.dataset.log)); renderDetail(); }));
  $('#dRename').onclick = () => promptBox('店名を編集', s.name, v => {
    if (String(s.id).startsWith('m:')) { db.manual[s.id].name = v; save(DATA_KEY, db); }
    else updateRec(s.id, r => r.customName = v);
    renderDetail(); });
  $('#dHide').onclick = () => { updateRec(s.id, r => r.closed = !s.closed); toast(s.closed ? '一覧に戻しました' : '非表示にしました（「非表示にした店」で確認できます）', 3500); renderDetail(); };
  const del = $('#dDelete');
  if (del) del.onclick = () => confirmBox(`「${s.name}」と記録を削除しますか？`, () => {
    delete db.manual[s.id]; delete db.recs[s.id]; save(DATA_KEY, db); closeDetail(); toast('削除しました'); });
}

// ===== ダイアログ =====
function openModal(h){ $('#mbox').innerHTML = h; $('#modal').hidden = false; }
function closeModal(){ $('#modal').hidden = true; }
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
function confirmBox(msg, ok){
  openModal(`<p style="font-size:15px">${esc(msg)}</p><div class="btns"><button class="btn ghost" id="mNo">キャンセル</button><button class="btn" id="mYes">OK</button></div>`);
  $('#mNo').onclick = closeModal; $('#mYes').onclick = () => { closeModal(); ok(); };
}
function promptBox(title, val, ok){
  openModal(`<h2>${esc(title)}</h2><input class="txt" id="mIn" value="${esc(val)}"><div class="btns"><button class="btn ghost" id="mNo">キャンセル</button><button class="btn" id="mYes">保存</button></div>`);
  const i = $('#mIn'); i.focus();
  const go = () => { const v = i.value.trim(); if (!v) return; closeModal(); ok(v); };
  $('#mNo').onclick = closeModal; $('#mYes').onclick = go; i.onkeydown = e => { if (e.key === 'Enter') go(); };
}
$('#btnAdd').onclick = () => {
  openModal(`<h2>店舗を追加</h2>
    <p>一覧に見つからない店舗を登録します。</p>
    <label>チェーン</label>
    <select class="txt" id="aChain">${Object.entries(CHAINS).map(([k, c]) => `<option value="${k}">${c.l}</option>`).join('')}</select>
    <label>店名</label>
    <input class="txt" id="aName" placeholder="例：相模大野駅前店">
    <label>地域</label>
    <select class="txt" id="aArea"><option value="相模原市|緑区">相模原市 緑区</option><option value="相模原市|中央区">相模原市 中央区</option><option value="相模原市|南区">相模原市 南区</option><option value="町田市|">町田市</option></select>
    <label>住所（任意）</label>
    <input class="txt" id="aAddr" placeholder="例：南区相模大野3-1-1">
    <label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" id="aHere" style="width:20px;height:20px"> 今いる場所を店舗の位置にする（近い順で使います）</label>
    <div class="btns"><button class="btn ghost" id="mNo">キャンセル</button><button class="btn" id="mYes">追加</button></div>`);
  $('#mNo').onclick = closeModal;
  $('#mYes').onclick = () => {
    const ch = $('#aChain').value; let nm = $('#aName').value.trim();
    if (!nm) return toast('店名を入力してください');
    if (!CHAINS[ch].re.test(nm)) nm = `${CHAINS[ch].l} ${nm}`;
    const [city, ward] = $('#aArea').value.split('|');
    const st = {id:'m:' + uid(), chain:ch, name:nm, city, ward, addr:$('#aAddr').value.trim(),
      lat:city === '町田市' ? 35.5466 : 35.5711, lng:city === '町田市' ? 139.4386 : 139.3735, noPos:true};
    const finish = () => { db.manual[st.id] = st; save(DATA_KEY, db); closeModal(); render(); toast('追加しました'); openDetail(st.id); };
    if ($('#aHere').checked && navigator.geolocation){
      navigator.geolocation.getCurrentPosition(p => { st.lat = p.coords.latitude; st.lng = p.coords.longitude; st.noPos = false; finish(); },
        () => { toast('現在地を取得できなかったので位置なしで追加します'); finish(); }, {enableHighAccuracy:true, timeout:12000});
    } else finish();
  };
};

// ===== 設定・バックアップ =====
$('#btnSettings').onclick = () => {
  const nrec = Object.keys(db.recs).length, nman = Object.keys(db.manual).length;
  openModal(`<h2>設定</h2>
    <p>店舗リスト：${cache ? `${cache.stores.length}店舗（${fmtDate(cache.fetchedAt)} 取得）` : 'なし'}</p>
    <div class="btns"><button class="btn ghost" id="sRefresh">店舗リストを最新に更新</button></div>
    <p class="hint">更新しても、扱い・履歴・メモは消えません。</p>
    <hr>
    <h2 style="font-size:15px">記録のバックアップ</h2>
    <p>記録（${nrec}店舗${nman ? `・手動追加${nman}店舗` : ''}）はこのスマホの中にだけ保存されています。機種変更の前などに書き出してください。</p>
    <div class="btns"><button class="btn ghost" id="sExport">書き出す</button><button class="btn ghost" id="sImport">読み込む</button></div>
    <div class="btns"><button class="btn" id="sClose">閉じる</button></div>`);
  $('#sClose').onclick = closeModal;
  $('#sRefresh').onclick = () => { closeModal(); refreshStores(false); };
  $('#sExport').onclick = exportData;
  $('#sImport').onclick = () => $('#importFile').click();
};
async function exportData(){
  const text = JSON.stringify(db), d = new Date();
  const name = `pokeca-backup-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
  const file = new File([text], name, {type:'application/json'});
  try {
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:name}); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$('#importFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const j = JSON.parse(await f.text()); if (!j.recs) throw 0;
    for (const [id, inc] of Object.entries(j.recs)){
      const cur = db.recs[id];
      if (!cur){ db.recs[id] = inc; continue; }
      const ids = new Set((cur.logs || []).map(l => l.id));
      cur.logs = [...(cur.logs || []), ...(inc.logs || []).filter(l => !ids.has(l.id))];
      if ((inc.updatedAt || 0) > (cur.updatedAt || 0)) Object.assign(cur, {handling:inc.handling, memo:inc.memo, customName:inc.customName, closed:inc.closed});
    }
    Object.assign(db.manual, j.manual || {});
    save(DATA_KEY, db); closeModal(); render(); toast('バックアップを読み込みました');
  } catch { toast('読み込めないファイルです'); }
};

// ===== 起動 =====
$('#fArea').value = ui.area; $('#fSort').value = ui.sort === 'near' ? 'name' : ui.sort; if (ui.sort === 'near') ui.sort = 'name';
[...$('#fStatus').children].forEach(c => c.classList.toggle('on', c.dataset.f === ui.status));
renderChainChips();
render();
if (!cache) refreshStores(true);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
